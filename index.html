<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Civic Ledger • My Vote SA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3/dist/cdn.min.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .star { transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1); }
        .star.active { color: #eab308; transform: scale(1.2); }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen pb-12">
    <div class="max-w-2xl mx-auto px-4 pt-8" x-data="ledgerApp()" x-init="init()">
        
        <!-- Header -->
        <header class="mb-10">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-4xl font-bold tracking-tighter">WARD CIVIC LEDGER</h1>
                    <p class="text-emerald-400 text-sm mt-1 font-medium">My Vote SA • Public Accountability Platform</p>
                </div>
                <div class="text-xs bg-zinc-900 px-3 py-1.5 rounded-xl border border-zinc-800 flex items-center gap-2">
                    <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
                    <span>Live</span>
                </div>
            </div>
            <div class="mt-4 text-xs text-zinc-400 bg-zinc-900 border border-zinc-800 p-4 rounded-2xl">
                <i class="fa-solid fa-shield-halved text-amber-400 mr-2"></i>
                POPIA compliant • Raw ID numbers are never stored • Reports are public record
            </div>
        </header>

        <form @submit.prevent="submitReport" class="space-y-10">
            
            <!-- Group 1: Identity -->
            <div class="bg-zinc-900 rounded-3xl p-6 border border-zinc-800">
                <h2 class="text-lg font-semibold mb-5 flex items-center gap-2">
                    <i class="fa-solid fa-user"></i> Identity Profile
                </h2>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-zinc-400 mb-1">First Name</label>
                        <input type="text" x-model="form.firstName" required
                               class="w-full bg-zinc-950 border border-zinc-700 rounded-2xl px-4 py-3 focus:outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-zinc-400 mb-1">Surname</label>
                        <input type="text" x-model="form.surname" required
                               class="w-full bg-zinc-950 border border-zinc-700 rounded-2xl px-4 py-3 focus:outline-none focus:border-emerald-600">
                    </div>
                </div>
                <div class="mt-4">
                    <label class="block text-xs font-medium text-zinc-400 mb-1">South African ID Number (13 digits)</label>
                    <input type="text" maxlength="13" x-model="form.idNumber" 
                           @input="form.idNumber = form.idNumber.replace(/\D/g, '')"
                           required placeholder="1234567890123"
                           class="w-full bg-zinc-950 border border-zinc-700 rounded-2xl px-4 py-3 focus:outline-none focus:border-emerald-600 font-mono">
                </div>
            </div>

            <!-- Group 2: Incident -->
            <div class="bg-zinc-900 rounded-3xl p-6 border border-zinc-800">
                <h2 class="text-lg font-semibold mb-5 flex items-center gap-2">
                    <i class="fa-solid fa-file-lines"></i> Service Failure Report
                </h2>
                
                <div class="mb-6">
                    <label class="block text-xs font-medium text-zinc-400 mb-2">Sector</label>
                    <select x-model="form.sector" required
                            class="w-full bg-zinc-950 border border-zinc-700 rounded-2xl px-4 py-3 focus:outline-none focus:border-emerald-600">
                        <option value="">Select sector</option>
                        <option value="saps">SAPS (Police)</option>
                        <option value="health">Public Health</option>
                        <option value="water">Water & Sanitation</option>
                        <option value="electricity">Electricity</option>
                        <option value="roads">Roads & Infrastructure</option>
                    </select>
                </div>

                <div class="mb-6">
                    <label class="block text-xs font-medium text-zinc-400 mb-2">Performance Rating</label>
                    <div class="flex gap-1">
                        <template x-for="n in 5" :key="n">
                            <button type="button" @click="setRating(n)"
                                    :class="{ 'star active': form.rating >= n }"
                                    class="star text-4xl text-zinc-600 hover:text-yellow-400">
                                ★
                            </button>
                        </template>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-2">Detailed Description <span class="text-red-400">*</span></label>
                    <textarea x-model="form.description" rows="5" minlength="10" required
                              class="w-full bg-zinc-950 border border-zinc-700 rounded-3xl px-5 py-4 focus:outline-none focus:border-emerald-600 resize-y"
                              placeholder="Describe the issue, location (suburb/ward), date/time..."></textarea>
                    <p class="text-xs text-zinc-500 mt-1" x-text="form.description.length + ' / minimum 10 characters'"></p>
                </div>
            </div>

            <!-- Group 3: Evidence -->
            <div class="bg-zinc-900 rounded-3xl p-6 border border-zinc-800">
                <h2 class="text-lg font-semibold mb-4">Evidence (Photo / Video)</h2>
                <input type="file" id="evidence" accept="image/*,video/*" @change="handleFileSelect" class="hidden">
                <label for="evidence"
                       class="cursor-pointer border-2 border-dashed border-zinc-700 hover:border-emerald-600 rounded-3xl h-48 flex flex-col items-center justify-center transition-colors">
                    <i class="fa-solid fa-camera text-3xl mb-3 text-zinc-400"></i>
                    <span class="text-sm text-zinc-400">Tap to capture or upload (max 5MB)</span>
                </label>
                
                <div x-show="previewUrl" class="mt-4 rounded-2xl overflow-hidden border border-zinc-700">
                    <img :src="previewUrl" class="w-full max-h-64 object-contain bg-black" alt="Preview">
                </div>
            </div>

            <!-- Submit -->
            <button type="submit"
                    :disabled="isSubmitting || !isFormValid()"
                    class="w-full h-16 text-lg font-semibold rounded-3xl transition-all flex items-center justify-center gap-3 disabled:opacity-50"
                    :class="isSubmitting ? 'bg-zinc-700' : 'bg-emerald-600 hover:bg-emerald-500'">
                <span x-text="isSubmitting ? 'Verifying & Committing to Public Record...' : 'Commit to Public Record'"></span>
                <i x-show="isSubmitting" class="fa-solid fa-spinner fa-spin"></i>
            </button>
        </form>

        <!-- Status -->
        <div x-show="message" class="mt-8 p-4 rounded-2xl text-sm"
             :class="success ? 'bg-emerald-900/50 border border-emerald-700 text-emerald-300' : 'bg-red-900/50 border border-red-700 text-red-300'">
            <span x-text="message"></span>
        </div>
    </div>

    <script>
        function ledgerApp() {
            return {
                form: {
                    firstName: '',
                    surname: '',
                    idNumber: '',
                    sector: '',
                    rating: 0,
                    description: '',
                    evidence: null
                },
                previewUrl: null,
                isSubmitting: false,
                message: '',
                success: false,

                init() {
                    // Restore identity from localStorage
                    const saved = localStorage.getItem('civicIdentity');
                    if (saved) this.form = { ...this.form, ...JSON.parse(saved) };
                },

                setRating(n) {
                    this.form.rating = n;
                },

                handleFileSelect(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    if (file.size > 5 * 1024 * 1024) {
                        this.message = "File too large. Maximum 5MB allowed.";
                        this.success = false;
                        return;
                    }
                    this.form.evidence = file;
                    this.previewUrl = URL.createObjectURL(file);
                },

                isFormValid() {
                    return this.form.firstName && this.form.surname && 
                           this.form.idNumber.length === 13 &&
                           this.form.sector && this.form.rating > 0 &&
                           this.form.description.length >= 10;
                },

                async submitReport() {
                    if (!this.isFormValid() || this.isSubmitting) return;
                    
                    this.isSubmitting = true;
                    this.message = '';

                    try {
                        const formData = new FormData();
                        formData.append('firstName', this.form.firstName);
                        formData.append('surname', this.form.surname);
                        formData.append('idNumber', this.form.idNumber);
                        formData.append('sector', this.form.sector);
                        formData.append('rating', this.form.rating);
                        formData.append('description', this.form.description);
                        if (this.form.evidence) {
                            formData.append('evidence', this.form.evidence);
                        }

                        const res = await fetch('/api/reports', {
                            method: 'POST',
                            body: formData
                        });

                        const data = await res.json();

                        if (res.ok) {
                            this.success = true;
                            this.message = `Report committed successfully! Ticket: ${data.ticketId}`;
                            
                            // Clear incident fields only
                            this.form.sector = '';
                            this.form.rating = 0;
                            this.form.description = '';
                            this.form.evidence = null;
                            this.previewUrl = null;
                            
                            // Persist identity
                            localStorage.setItem('civicIdentity', JSON.stringify({
                                firstName: this.form.firstName,
                                surname: this.form.surname,
                                idNumber: this.form.idNumber
                            }));
                        } else {
                            throw new Error(data.error || 'Submission failed');
                        }
                    } catch (err) {
                        this.success = false;
                        this.message = err.message || 'Network error. Report queued for later submission.';
                    } finally {
                        this.isSubmitting = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
